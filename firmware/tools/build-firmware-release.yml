name: Build and Publish Application Firmware

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "firmware/source/**"
      - "firmware/tools/build_firmware_deployment.py"

permissions:
  contents: write

concurrency:
  group: sprinklers1-application-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Sprinklers1 application firmware
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Show build environment
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner image: $env:ImageOS"
          python --version
          gh --version

      - name: Build application firmware
        shell: pwsh
        run: |
          python firmware\tools\build_firmware_deployment.py

      - name: Read firmware metadata
        id: firmware
        shell: pwsh
        run: |
          $firmwarePath = (Resolve-Path "firmware\dist\main.zip").Path

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($firmwarePath)

          try {
              $entry = $archive.GetEntry("firmware_info.json")

              if ($null -eq $entry) {
                  throw "firmware_info.json is missing from main.zip."
              }

              $reader = [System.IO.StreamReader]::new($entry.Open())

              try {
                  $metadataText = $reader.ReadToEnd()
              }
              finally {
                  $reader.Dispose()
              }
          }
          finally {
              $archive.Dispose()
          }

          $metadata = $metadataText | ConvertFrom-Json
          $version = [string]$metadata.version
          $name = [string]$metadata.name

          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "The built firmware does not contain a version."
          }

          if ([string]::IsNullOrWhiteSpace($name)) {
              $name = "Sprinklers1"
          }

          $tag = "v$version"
          $packageName = "$name-v$version.zip"
          $packagePath = "firmware\dist\$packageName"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "firmware_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_name=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_path=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Application firmware version: $version"
          Write-Host "Release tag: $tag"
          Write-Host "Release package: $packageName"

      - name: Build application release package
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.firmware.outputs.package_path }}
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "sprinklers1-application-release"

          if (Test-Path $staging) {
              Remove-Item -Path $staging -Recurse -Force
          }

          New-Item -ItemType Directory -Path $staging | Out-Null

          Copy-Item `
              "firmware\source\device_loader_main.py" `
              (Join-Path $staging "device_loader_main.py")

          Copy-Item `
              "firmware\dist\main.zip" `
              (Join-Path $staging "main.zip")

          if (Test-Path $env:PACKAGE_PATH) {
              Remove-Item -Path $env:PACKAGE_PATH -Force
          }

          Compress-Archive `
              -Path (Join-Path $staging "*") `
              -DestinationPath $env:PACKAGE_PATH `
              -CompressionLevel Optimal

      - name: Verify application release package
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.firmware.outputs.package_path }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $package = [System.IO.Compression.ZipFile]::OpenRead(
              (Resolve-Path $env:PACKAGE_PATH).Path
          )

          try {
              $names = @($package.Entries | ForEach-Object { $_.FullName })

              $required = @(
                  "device_loader_main.py",
                  "main.zip"
              )

              foreach ($name in $required) {
                  if ($names -notcontains $name) {
                      throw "Application release package is missing: $name"
                  }
              }

              if ($names.Count -ne 2) {
                  throw "Application release package should contain exactly 2 files; found $($names.Count)."
              }
          }
          finally {
              $package.Dispose()
          }

      - name: Publish application GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.firmware.outputs.tag }}
          VERSION: ${{ steps.firmware.outputs.version }}
          FIRMWARE_NAME: ${{ steps.firmware.outputs.firmware_name }}
          PACKAGE_PATH: ${{ steps.firmware.outputs.package_path }}
        run: |
          gh release create `
              $env:RELEASE_TAG `
              $env:PACKAGE_PATH `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "$env:FIRMWARE_NAME firmware v$env:VERSION" `
              --generate-notes

      - name: Commit next application firmware version
        shell: pwsh
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.firmware.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add firmware/tools/next_firmware_version.json
          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
              Write-Host "Application version file did not change; nothing to commit."
              exit 0
          }

          git commit -m "Bump application firmware version after v$env:VERSION release"
          git push origin "HEAD:$env:BRANCH_NAME"
