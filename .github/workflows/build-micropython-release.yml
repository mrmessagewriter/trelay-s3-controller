name: Build and Publish MicroPython LILYGO_T_RELAY_S3_NCM

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "firmware/micropython/**"
      - "firmware/tools/build_micropython_ncm.py"

permissions:
  contents: write

concurrency:
  group: micropython-lilygo-t-relay-s3-ncm-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish MicroPython LILYGO_T_RELAY_S3_NCM
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install native build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libusb-1.0-0 \
            dfu-util

      - name: Cache Espressif toolchain
        uses: actions/cache@v5
        with:
          path: ~/.espressif
          key: esp-idf-tools-${{ hashFiles('firmware/micropython/micropython_build.json') }}-esp32s3

      - name: Read MicroPython release version
        id: runtime
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import subprocess

          path = Path("firmware/tools/next_micropython_version.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          configured_version = str(data["next_version"]).strip()

          parts = configured_version.split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(
                  "next_micropython_version.json must contain MAJOR.MINOR.PATCH"
              )

          major, minor, patch = (int(part) for part in parts)

          # Recover automatically if a previous release was published but the
          # final next-version commit lost a race with another push to main.
          while True:
              version = f"{major}.{minor}.{patch}"
              tag = "micropython-LILYGO_T_RELAY_S3_NCM-v" + version

              result = subprocess.run(
                  [
                      "git",
                      "ls-remote",
                      "--exit-code",
                      "--tags",
                      "origin",
                      "refs/tags/" + tag,
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )

              if result.returncode != 0:
                  break

              print(
                  "Release tag already exists:",
                  tag,
                  "- trying next patch version.",
              )
              patch += 1

          values = {
              "version": version,
              "tag": tag,
              "asset_name": "LILYGO_T_RELAY_S3_NCM-SPIRAM_OCT-v" + version + ".bin",
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")

          print("MicroPython runtime version:", version)
          print("Release tag:", values["tag"])
          print("Release asset:", values["asset_name"])
          PY

      # Do not stop the job immediately when the build fails.  We need the
      # following diagnostic steps to print ESP-IDF/Ninja's real error.
      - name: Build master-based MicroPython runtime
        id: micropython_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          python firmware/tools/build_micropython_ncm.py \
            --bootstrap \
            --work-dir "$HOME/micropython-lilygo-t-relay-s3-ncm-build" \
            2>&1 | tee "$RUNNER_TEMP/micropython-build.log"

      - name: Print ESP-IDF failure diagnostics
        if: steps.micropython_build.outcome == 'failure'
        shell: bash
        run: |
          set +e

          BUILD_ROOT="$HOME/micropython-lilygo-t-relay-s3-ncm-build/micropython/ports/esp32"

          echo
          echo "============================================================"
          echo " COMPLETE BUILD LOG - ERROR/FATAL/FAILED LINES"
          echo "============================================================"

          if [ -f "$RUNNER_TEMP/micropython-build.log" ]; then
            grep -nEi \
              '(^|[^a-z])(error:|fatal:|FAILED:|undefined reference|ninja: build stopped|CMake Error|make: \*\*\*)' \
              "$RUNNER_TEMP/micropython-build.log" \
              | tail -n 300 || true

            echo
            echo "============================================================"
            echo " LAST 250 LINES OF COMPLETE BUILD LOG"
            echo "============================================================"

            tail -n 250 "$RUNNER_TEMP/micropython-build.log" || true
          fi

          echo
          echo "============================================================"
          echo " ESP-IDF GENERATED LOG FILES"
          echo "============================================================"

          find "$BUILD_ROOT" \
            -type f \
            \( \
              -name 'idf_py_stderr_output_*' \
              -o -name 'idf_py_stdout_output_*' \
              -o -name 'CMakeError.log' \
              -o -name 'CMakeOutput.log' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | while IFS= read -r logfile; do
                echo
                echo "------------------------------------------------------------"
                echo "$logfile"
                echo "------------------------------------------------------------"

                grep -nEi \
                  '(^|[^a-z])(error:|fatal:|FAILED:|undefined reference|ninja: build stopped|CMake Error|make: \*\*\*)' \
                  "$logfile" \
                  | tail -n 200 || true

                echo
                echo "Last 160 lines:"
                tail -n 160 "$logfile" || true
              done

          echo
          echo "============================================================"
          echo " BUILD DIRECTORY CONTENTS"
          echo "============================================================"

          find "$BUILD_ROOT" \
            -maxdepth 3 \
            -type f \
            \( \
              -name 'build.ninja' \
              -o -name 'compile_commands.json' \
              -o -name 'sdkconfig' \
            \) \
            -print \
            2>/dev/null || true

      - name: Upload MicroPython failure diagnostics
        if: steps.micropython_build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: micropython-LILYGO_T_RELAY_S3_NCM-failure-diagnostics
          path: |
            ${{ runner.temp }}/micropython-build.log
            /home/runner/micropython-lilygo-t-relay-s3-ncm-build/micropython/ports/esp32/build-*/log/
            /home/runner/micropython-lilygo-t-relay-s3-ncm-build/micropython/ports/esp32/build-*/submodules/log/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Fail job after diagnostics
        if: steps.micropython_build.outcome == 'failure'
        shell: bash
        run: |
          echo "The MicroPython build failed. Diagnostics were printed and uploaded above."
          exit 1

      - name: Stage versioned MicroPython release asset
        shell: bash
        env:
          ASSET_NAME: ${{ steps.runtime.outputs.asset_name }}
        run: |
          mkdir -p firmware/dist/micropython/release

          cp \
            firmware/dist/micropython/LILYGO_T_RELAY_S3_NCM-SPIRAM_OCT.bin \
            "firmware/dist/micropython/release/$ASSET_NAME"

          test -s "firmware/dist/micropython/release/$ASSET_NAME"

      - name: Publish MicroPython board-runtime GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.runtime.outputs.tag }}
          VERSION: ${{ steps.runtime.outputs.version }}
          ASSET_NAME: ${{ steps.runtime.outputs.asset_name }}
        run: |
          gh release create \
            "$RELEASE_TAG" \
            "firmware/dist/micropython/release/$ASSET_NAME" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MicroPython LILYGO_T_RELAY_S3_NCM v$VERSION" \
            --notes "MicroPython build for LILYGO T-Relay ESP32-S3 with Octal PSRAM and USB CDC-NCM networking."

      - name: Advance MicroPython board-runtime version safely
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.runtime.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A long firmware build can finish after another commit has already
          # advanced main. Rebase/reset onto the latest remote state, reapply
          # only the version bump, and retry if another push wins the race.
          for attempt in 1 2 3 4 5; do
            echo
            echo "Version bump push attempt $attempt of 5"

            git fetch origin "$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"

            python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("firmware/tools/next_micropython_version.json")
          released_version = os.environ["VERSION"]

          major, minor, patch = (
              int(part)
              for part in released_version.split(".")
          )
          required_next = (major, minor, patch + 1)

          data = json.loads(path.read_text(encoding="utf-8"))
          configured = str(data["next_version"]).strip()

          configured_parts = configured.split(".")
          if (
              len(configured_parts) != 3
              or not all(part.isdigit() for part in configured_parts)
          ):
              raise SystemExit(
                  "next_micropython_version.json must contain "
                  "MAJOR.MINOR.PATCH"
              )

          current_next = tuple(
              int(part)
              for part in configured_parts
          )

          # Never move the version backwards if another workflow/user has
          # already advanced it further.
          target = max(
              current_next,
              required_next,
          )

          target_text = ".".join(
              str(part)
              for part in target
          )

          if target_text == configured:
              print(
                  "Remote next MicroPython version is already",
                  target_text,
              )
          else:
              path.write_text(
                  json.dumps(
                      {"next_version": target_text},
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

              print(
                  "Advancing next MicroPython version:",
                  configured,
                  "->",
                  target_text,
              )
          PY

            git add firmware/tools/next_micropython_version.json

            if git diff --cached --quiet; then
              echo "Remote version file is already sufficiently advanced."
              exit 0
            fi

            git commit \
              -m "Bump LILYGO_T_RELAY_S3_NCM MicroPython build version after v$VERSION release"

            if git push origin "HEAD:$BRANCH_NAME"; then
              echo "Version bump pushed successfully."
              exit 0
            fi

            echo "main advanced during push attempt $attempt; retrying against latest remote state."

            # The next loop resets onto origin/main, so discard this local
            # retry commit and recreate the minimal version change.
            sleep $((attempt * 2))
          done

          echo "Unable to push the MicroPython version bump after 5 attempts."
          exit 1

