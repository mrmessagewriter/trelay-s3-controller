name: Repository Traffic Report

on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * 1'
  push:
    branches:
      - main
    paths:
      - .github/workflows/traffic-report.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize repository traffic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ['REPOSITORY']

          def gh(path):
              result = subprocess.run(
                  ['gh', 'api', path],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  raise RuntimeError(result.stderr.strip() or result.stdout.strip())
              return json.loads(result.stdout)

          views = gh(f'repos/{repo}/traffic/views')
          clones = gh(f'repos/{repo}/traffic/clones')
          referrers = gh(f'repos/{repo}/traffic/popular/referrers')
          paths = gh(f'repos/{repo}/traffic/popular/paths')

          lines = [
              '# Repository Traffic Report',
              '',
              'GitHub traffic data covers the most recent 14-day window.',
              '',
              '## Summary',
              '',
              '| Metric | Total | Unique |',
              '| --- | ---: | ---: |',
              f"| Views | {views.get('count', 0)} | {views.get('uniques', 0)} |",
              f"| Clones | {clones.get('count', 0)} | {clones.get('uniques', 0)} |",
              '',
              '## Top referrers',
              '',
              '| Referrer | Views | Unique visitors |',
              '| --- | ---: | ---: |',
          ]

          if referrers:
              for item in referrers:
                  lines.append(
                      f"| {item.get('referrer', '')} | {item.get('count', 0)} | {item.get('uniques', 0)} |"
                  )
          else:
              lines.append('| No referrer data yet | 0 | 0 |')

          lines.extend([
              '',
              '## Popular repository content',
              '',
              '| Path | Title | Views | Unique visitors |',
              '| --- | --- | ---: | ---: |',
          ])

          if paths:
              for item in paths:
                  title = str(item.get('title', '')).replace('|', '\\|')
                  path = str(item.get('path', '')).replace('|', '\\|')
                  lines.append(
                      f"| `{path}` | {title} | {item.get('count', 0)} | {item.get('uniques', 0)} |"
                  )
          else:
              lines.append('| — | No path data yet | 0 | 0 |')

          lines.extend([
              '',
              '## How to use this report',
              '',
              '- Compare unique visitors before and after announcements.',
              '- Prefer referrers that produce clones, stars, issues, or useful feedback.',
              '- Use popular-path data to decide which documentation deserves more prominent README links.',
          ])

          summary = '\n'.join(lines) + '\n'
          print(summary)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(summary)
