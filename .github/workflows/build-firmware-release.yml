name: Build and Publish LilyGo T-Relay-S3 Controller Firmware

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "firmware/source/**"
      - "firmware/tools/build_firmware_deployment.py"
      - ".github/workflows/build-firmware-release.yml"

permissions:
  contents: write

concurrency:
  group: lilygo-t-relay-s3-controller-firmware-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish LilyGo T-Relay-S3 Controller Firmware
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Show build environment
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner image: $env:ImageOS"
          python --version
          gh --version

      - name: Build application firmware
        shell: pwsh
        run: |
          python firmware\tools\build_firmware_deployment.py

      - name: Read firmware metadata
        id: firmware
        shell: pwsh
        run: |
          $firmwarePath = (Resolve-Path "firmware\dist\main.zip").Path

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($firmwarePath)

          try {
              $entry = $archive.GetEntry("firmware_info.json")

              if ($null -eq $entry) {
                  throw "firmware_info.json is missing from main.zip."
              }

              $reader = [System.IO.StreamReader]::new($entry.Open())

              try {
                  $metadataText = $reader.ReadToEnd()
              }
              finally {
                  $reader.Dispose()
              }
          }
          finally {
              $archive.Dispose()
          }

          $metadata = $metadataText | ConvertFrom-Json
          $version = [string]$metadata.version

          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "The built firmware does not contain a version."
          }

          # Release branding is intentionally separate from the internal
          # application/device name stored in firmware_info.json.
          $releaseName = "LilyGo T-Relay-S3 Controller Firmware"
          $packageBaseName = "LilyGo-T-Relay-S3-Controller-Firmware"

          $tag = "v$version"
          $packageName = "$packageBaseName-v$version.zip"
          $packagePath = "firmware\dist\$packageName"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_name=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_path=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Application firmware version: $version"
          Write-Host "Release title: $releaseName v$version"
          Write-Host "Release tag: $tag"
          Write-Host "Release package: $packageName"

      - name: Prepare application release package
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.firmware.outputs.package_path }}
        run: |
          $source = (Resolve-Path "firmware\dist\deployment.zip").Path
          $destination = $env:PACKAGE_PATH
          Copy-Item -LiteralPath $source -Destination $destination -Force
          Write-Host "Prepared self-contained release package: $destination"

      - name: Verify uncompressed application release package
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.firmware.outputs.package_path }}
        run: |
          @'
          import io
          import os
          import zipfile
          from pathlib import Path

          package_path = Path(os.environ["PACKAGE_PATH"])

          required = {
              "boot.py",
              "device_loader_main.py",
              "main.zip",
          }

          with zipfile.ZipFile(package_path, "r") as outer:
              infos = outer.infolist()
              names = {info.filename for info in infos}

              if names != required:
                  raise SystemExit(
                      "Unexpected release package contents: {}".format(
                          sorted(names)
                      )
                  )

              for info in infos:
                  if info.compress_type != zipfile.ZIP_STORED:
                      raise SystemExit(
                          "Compressed outer ZIP entry found: {}".format(
                              info.filename
                          )
                      )

              main_zip_bytes = outer.read("main.zip")

          with zipfile.ZipFile(
              io.BytesIO(main_zip_bytes),
              "r",
          ) as inner:
              for info in inner.infolist():
                  if info.compress_type != zipfile.ZIP_STORED:
                      raise SystemExit(
                          "Compressed main.zip entry found: {}".format(
                              info.filename
                          )
                      )

          print("Verified:")
          print("  outer release ZIP: ZIP_STORED")
          print("  inner main.zip:     ZIP_STORED")
          '@ | python -

      - name: Publish application GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.firmware.outputs.tag }}
          VERSION: ${{ steps.firmware.outputs.version }}
          RELEASE_NAME: ${{ steps.firmware.outputs.release_name }}
          PACKAGE_NAME: ${{ steps.firmware.outputs.package_name }}
          PACKAGE_PATH: ${{ steps.firmware.outputs.package_path }}
        run: |
          $releaseNotes = @"
          ## TRelay-S3-Controller

          MicroPython web and REST control for the **LILYGO T-Relay ESP32-S3** with six-relay control, schedules, persistent event logging, optional weather conditions, Wi-Fi, and optional USB CDC-NCM networking.

          ### Download

          Download **$env:PACKAGE_NAME** from the assets below. It is the self-contained application deployment package containing `boot.py`, the permanent ZIP loader, and `main.zip`.

          ### Install

          ```cmd
          python -m pip install mpremote pyserial
          python firmware\tools\upload_controller_firmware.py COM3 --firmware $env:PACKAGE_NAME
          ```

          Replace `COM3` with the serial port assigned to the ESP32-S3.

          The custom MicroPython USB-NCM runtime is only required if you want the controller reachable over USB networking. Wi-Fi operation does not require USB CDC-NCM.

          See the repository README for complete build, deployment, USB-network, and configuration instructions.
          "@

          gh release create `
              $env:RELEASE_TAG `
              $env:PACKAGE_PATH `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "$env:RELEASE_NAME v$env:VERSION" `
              --notes "$releaseNotes" `
              --generate-notes

      - name: Commit next application firmware version
        shell: pwsh
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.firmware.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add firmware/tools/next_firmware_version.json
          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
              Write-Host "Application version file did not change; nothing to commit."
              exit 0
          }

          git commit -m "Bump application firmware version after v$env:VERSION release"
          git push origin "HEAD:$env:BRANCH_NAME"
