name: TRelay-S3-Controller Discoverability Setup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/discoverability-setup.yml

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install image dependencies
        run: python -m pip install pillow imageio numpy

      - name: Generate README and social-preview assets
        shell: python
        run: |
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import imageio.v2 as imageio
          import numpy as np

          root = Path('docs/images')
          root.mkdir(parents=True, exist_ok=True)

          W,H=1200,820
          BG=(17,24,39); PANEL=(31,41,55); BORDER=(55,65,81)
          TEXT=(243,244,246); MUTED=(156,163,175); BLUE=(147,197,253)
          YELLOW=(251,191,36); GREEN=(74,222,128); RED=(248,113,113)
          BUTTON=(75,85,99)

          def font(size, bold=False):
              paths = [
                  '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
                  '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf',
              ]
              for p in paths:
                  try:
                      return ImageFont.truetype(p, size)
                  except OSError:
                      pass
              return ImageFont.load_default()

          f14=font(14); f16=font(16); f18b=font(18,True); f20b=font(20,True)
          f28b=font(28,True); f48b=font(48,True); f23=font(23)

          def rr(d, box, r=12, fill=PANEL, outline=BORDER, width=2):
              d.rounded_rectangle(box, radius=r, fill=fill, outline=outline, width=width)

          def button(d,x,y,w,label,fill=BUTTON):
              d.rounded_rectangle((x,y,x+w,y+36),radius=8,fill=fill)
              bbox=d.textbbox((0,0),label,font=f14); tw=bbox[2]-bbox[0]
              d.text((x+(w-tw)/2,y+9),label,font=f14,fill=TEXT)

          def make_ui(relay2=False):
              im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im)
              d.rectangle((0,0,W,104),fill=PANEL)
              d.text((W/2,20),'TRelay-S3-Controller',font=f28b,fill=TEXT,anchor='ma')
              d.text((W/2,56),'Firmware v1.0.23  •  Connected: 172.31.77.1',font=f14,fill=MUTED,anchor='ma')
              d.text((W/2,78),'Local time synchronized  •  Wi-Fi + USB CDC-NCM',font=f14,fill=MUTED,anchor='ma')
              x0=150; y=128
              for label,w in [('Settings',92),('Events',82),('Sync Time Now',128),('Refresh Weather',142)]:
                  button(d,x0,y,w,label); x0+=w+10
              rr(d,(150,182,1050,310)); d.text((172,202),'Next 3 Events',font=f20b,fill=TEXT)
              rows=[('Thursday 07:00','Morning ventilation','Relay ON'),('Thursday 09:30','Pump cycle','Relay ON'),('Thursday 18:00','Evening shutdown','All Relays OFF')]
              yy=238
              for tm,name,action in rows:
                  d.text((172,yy),tm,font=f16,fill=BLUE); d.text((330,yy),name,font=f16,fill=TEXT); d.text((610,yy),action,font=f16,fill=MUTED); yy+=25
              rr(d,(150,326,1050,438)); d.text((172,346),'Local Weather',font=f20b,fill=TEXT)
              weather=[('Temperature','72.4 °F'),('Humidity','34%'),('Wind','6.2 mph'),('Rain chance','5%'),('ET₀ today','0.18 in')]
              wx=172
              for title,val in weather:
                  d.rounded_rectangle((wx,382,wx+150,420),radius=8,fill=BG)
                  d.text((wx+10,388),title,font=f14,fill=MUTED); d.text((wx+10,404),val,font=f14,fill=TEXT)
                  wx+=166
              relays=[('Workshop Lights',True),('Exhaust Fan',relay2),('Pump',False),('Garage Door',False),('Heater',False),('Spare Relay',False)]
              for i,(name,state) in enumerate(relays):
                  col=i%3; row=i//3; x=150+col*302; yy=458+row*154
                  outline=GREEN if state else BORDER
                  rr(d,(x,yy,x+282,yy+134),fill=PANEL,outline=outline)
                  d.text((x+18,yy+16),name,font=f18b,fill=TEXT); d.text((x+18,yy+43),f'Relay {i+1}',font=f14,fill=MUTED)
                  d.text((x+18,yy+69),'ON' if state else 'OFF',font=f18b,fill=GREEN if state else RED)
                  button(d,x+18,yy+92,72,'ON',(22,163,74)); button(d,x+98,yy+92,72,'OFF',(220,38,38)); button(d,x+178,yy+92,86,'Toggle',(37,99,235))
              return im

          ui=make_ui(False)
          ui.save(root/'web-ui.png', optimize=True)

          frames=[make_ui(False),make_ui(True),make_ui(False),make_ui(True)]
          imageio.mimsave(root/'relay-demo.gif',[np.array(f) for f in frames],duration=[0.8,0.8,0.8,0.8],loop=0)

          SW,SH=1280,640
          sp=Image.new('RGB',(SW,SH),BG); d=ImageDraw.Draw(sp)
          rr(d,(44,44,590,596),r=26,fill=PANEL,outline=PANEL,width=1)
          d.text((78,88),'TRelay-S3-Controller',font=f48b,fill=TEXT)
          d.multiline_text((80,168),'MicroPython web + REST control for\nthe LILYGO T-Relay ESP32-S3',font=f23,fill=(209,213,219),spacing=8)
          chips=['6 relays','Scheduling','Wi-Fi','USB CDC-NCM','REST API','Weather rules']
          x,y=80,296
          for c in chips:
              bbox=d.textbbox((0,0),c,font=f18b); cw=(bbox[2]-bbox[0])+28
              if x+cw>550: x=80; y+=50
              d.rounded_rectangle((x,y,x+cw,y+36),radius=18,fill=BORDER)
              d.text((x+14,y+7),c,font=f18b,fill=(219,234,254)); x+=cw+10
          d.text((80,520),'github.com/mrmessagewriter/trelay-s3-controller',font=f16,fill=BLUE)
          preview=ui.resize((610,417))
          sp.paste(preview,(626,112))
          sp.save(root/'social-preview.png', optimize=True)

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/web-ui.png docs/images/relay-demo.gif docs/images/social-preview.png
          if git diff --cached --quiet; then
            echo 'Visual assets already current.'
          else
            git commit -m 'Add project discovery visual assets'
            git push origin HEAD:main
          fi

      - name: Improve current application release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## TRelay-S3-Controller

          MicroPython web and REST control for the **LILYGO T-Relay ESP32-S3** with six-relay control, schedules, persistent event logging, optional weather conditions, Wi-Fi, and optional USB CDC-NCM networking.

          ### Download

          Download **LilyGo-T-Relay-S3-Controller-Firmware-v1.0.23.zip** below. This is the self-contained application deployment package containing `boot.py`, the permanent ZIP loader, and `main.zip`.

          ### Install

          ```cmd
          python -m pip install mpremote pyserial
          python firmware\tools\upload_controller_firmware.py COM3 --firmware LilyGo-T-Relay-S3-Controller-Firmware-v1.0.23.zip
          ```

          Replace `COM3` with the serial port assigned to the ESP32-S3.

          The custom MicroPython USB-NCM runtime is only required if you want the controller reachable over USB networking. Wi-Fi operation does not require USB CDC-NCM.

          Full documentation is available in the repository README.

          **Full Changelog:** https://github.com/mrmessagewriter/trelay-s3-controller/compare/v1.0.22...v1.0.23
          EOF
          gh release edit v1.0.23 --repo '${{ github.repository }}' --notes-file /tmp/release-notes.md

      - name: Attempt repository description update
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api --method PATCH "repos/${{ github.repository }}" \
            -f description='MicroPython web and REST controller for the LILYGO T-Relay ESP32-S3 with relay scheduling, Wi-Fi, USB CDC-NCM, weather conditions, and persistent automation.'

      - name: Attempt repository topics update
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > /tmp/topics.json <<'EOF'
          {"names":["esp32","esp32-s3","micropython","lilygo","t-relay","relay-controller","iot","home-automation","rest-api","web-interface","wifi","usb-ncm","embedded","automation","scheduler"]}
          EOF
          gh api --method PUT "repos/${{ github.repository }}/topics" --input /tmp/topics.json
